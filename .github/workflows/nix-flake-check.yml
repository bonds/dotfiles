# CI for the nix flake. Live since 2026-10-01: 70 runs, 6 failures, all of
# them in the first week while the workflow itself was being shaken out (the
# last was 2026-10-06). It has earned its keep at least once — see the
# "lint: fix two statix warnings that broke the new CI statix-check" commit.
#
# The nix flake lives at .config/nix inside the dotfiles repo. GitHub only
# reads workflows from the repository root, which here is $HOME, so this file
# sits at .github/workflows/ rather than .config/nix/.github/workflows/.
#
# What it does: installs Nix (Determinate Systems installer, which enables
# flakes by default) and runs `nix flake check` in .config/nix. That covers
# every flake check, including the two Python suites — `what-changed-test`
# (166 tests) and `reel-summarize-test` (70) — because they are `checks`, not
# packages. `nix flake check` never builds packages, which is exactly why
# suites that only run in a package's checkPhase are invisible to it.
#
# Not covered here, deliberately:
#   - the 16 routing evals in .config/nix/pkgs/pi/evals/ — they need a Deep
#     Infra API key and cost money per run, so they stay a manual step.
#   - building the x86_64-linux toplevels; those need a Linux runner (see the
#     optional second job below).
#
# Runner: macos-14 is arm64 (aarch64-darwin), matching the flake's darwin
# system. `nix flake check` evaluates every check for aarch64-darwin (including
# the eval checks for the x86_64-linux hosts — evaluation is platform
# independent) and skips x86_64-linux checks with a warning, exactly as it does
# locally.
name: nix flake check

on:
  push:
    paths:
      - ".config/nix/**"
      - ".github/workflows/nix-flake-check.yml"
  pull_request:
    paths:
      - ".config/nix/**"
      - ".github/workflows/nix-flake-check.yml"
  workflow_dispatch:

jobs:
  flake-check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: nix flake check
        working-directory: .config/nix
        run: nix flake check -L

      # Host-config evaluation as DIRECT evals, outside the sandbox — a
      # sandboxed `nix eval` check cannot reach the nix daemon on macOS (see
      # the note in flake/checks.nix). Mirrors the pre-push hook.
      - name: evaluate machine configs
        working-directory: .config/nix
        run: |
          for target in \
            nixosConfigurations.sophrosyne \
            nixosConfigurations.metanoia \
            darwinConfigurations.accismus; do
            echo "evaluating .#$target..."
            nix eval --raw ".#$target.config.system.build.toplevel.drvPath" >/dev/null
          done

  # Optional: build the two NixOS toplevels on Linux. Uncomment once a runner
  # is available; `nix flake check` above only evaluates them.
  #
  # nixos-toplevels:
  #   runs-on: ubuntu-24.04
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: DeterminateSystems/nix-installer-action@v14
  #     - working-directory: .config/nix
  #       run: |
  #         nix eval --raw .#nixosConfigurations.metanoia.config.system.build.toplevel.drvPath
  #         nix eval --raw .#nixosConfigurations.sophrosyne.config.system.build.toplevel.drvPath
