# User-level Nix config.
# These mirror the flake's nixConfig block (extra-* substituters + public keys)
# at the trusted-user level, so running `nr` / nix as an unprivileged user doesn't
# emit "Ignoring the client-specified setting 'trusted-...'" warnings.
#
# IMPORTANT: must use the `extra-*` variants, not `trusted-*`. The non-extra
# keys REPLACE the daemon's list (e.g. /etc/nix/nix.conf's cache.nixos.org key),
# which silently broke binary-cache substitution and forced from-source builds.
#
# NOTE: on macOS the USER config file is at ~/.config/nix/nix.conf only when
# NIX_USER_CONF_FILES is unset (default lookup: ~/.config/nix/nix.conf);
# 12+ Nix also checks $XDG_CONFIG_HOME/nix/nix.conf.
extra-trusted-substituters = https://cache.garnix.io https://nix-community.cachix.org https://zen-browser.cachix.org
extra-trusted-public-keys = cache.garnix.io:CTFPyKSLcx5RMJKfLo5EEPUObbA78bD7HEGj2x7a7Bs= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= zen-browser.cachix.org-1:6ABdUuAq2NIDh3tKf/5uAn7LoFO2duBBLgJMhsF3cig=